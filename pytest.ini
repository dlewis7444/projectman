[pytest]
# Never collect tests from agent worktrees nested under the repo —
# running pytest at the repo root must test THIS tree only. Without this,
# a root run silently mixes in every .claude/worktrees/*/tests/ file
# (observed: 296-test main tree reporting 368 by absorbing a feature
# branch's new tests while importing that branch's modules).
norecursedirs = .claude .worktrees .git
